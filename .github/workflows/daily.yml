name: Daily BTS Wire Update

on:
  schedule:
    # 매일 KST 자정 = UTC 15:00 (전날 데이터 수집)
    - cron: '0 15 * * *'
  workflow_dispatch:  # GitHub Actions 탭에서 수동 실행 가능

permissions:
  contents: write  # 커밋·푸시 권한

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Collect news (BCI)
        run: python scripts/collect.py

      - name: Classify articles
        run: python scripts/classify.py

      - name: Compute BCI
        run: python scripts/compute.py

      - name: Collect Wikipedia heat
        run: python scripts/heat.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push
          fi
