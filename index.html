<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTS Wire</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --accent: #BB86FC; }
  * { -webkit-font-smoothing: antialiased; }
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 300; color: #111; letter-spacing: -0.01em; }
  body[lang="ja"], body[lang="zh"] { font-family: 'Pretendard', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Microsoft YaHei', sans-serif; }
  .accent { color: var(--accent); }
  .bg-accent { background-color: var(--accent); }
  .border-accent { border-color: var(--accent); }
  .scrollbar-thin::-webkit-scrollbar { width: 3px; height: 3px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 2px; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .acc-icon { transform: rotate(45deg); }
  .acc-icon { transition: transform .2s ease; }
  .shorts-card { aspect-ratio: 9/16; }
  .video-card { aspect-ratio: 16/9; }
  .num-feat { font-feature-settings: "tnum"; }
  .hover-lift { transition: transform .15s ease; }
  .hover-lift:hover { transform: translateY(-1px); }
  .frame-bar { transition: filter .2s; }
  .frame-bar:hover { filter: brightness(1.1); }
  .tabs-scroll { scrollbar-width: none; }
  .tabs-scroll::-webkit-scrollbar { display: none; }
  .lang-tab { padding: 2px 6px; font-size: 10px; letter-spacing: 0.05em; transition: color .15s; }
</style>
</head>
<body lang="ko" class="bg-white">

<!-- HEADER -->
<header class="border-b border-neutral-100 sticky top-0 bg-white/90 backdrop-blur z-30">
  <div class="max-w-7xl mx-auto px-5 lg:px-8 py-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-2 h-2 rounded-full bg-accent shrink-0"></div>
      <h1 class="text-lg font-medium tracking-tight truncate">
        <span data-i18n="siteName">BTS Wire</span><span class="accent font-light"> · </span><span class="font-light text-neutral-600" data-i18n="siteSub"></span>
      </h1>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button data-lang="ko" class="lang-tab">KO</button>
      <span class="text-neutral-200 text-[9px]">|</span>
      <button data-lang="en" class="lang-tab">EN</button>
      <span class="text-neutral-200 text-[9px]">|</span>
      <button data-lang="ja" class="lang-tab">JA</button>
      <span class="text-neutral-200 text-[9px]">|</span>
      <button data-lang="zh" class="lang-tab">中</button>
      <span class="text-neutral-200 text-[9px]">|</span>
      <button data-lang="es" class="lang-tab">ES</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-5 lg:px-8 py-6 lg:py-10">

  <!-- INTRO -->
  <div class="mb-10 lg:mb-14 max-w-3xl">
    <p class="text-xs uppercase tracking-[0.25em] text-neutral-400 mb-3" data-i18n="introEyebrow"></p>
    <h2 class="text-2xl lg:text-3xl font-light leading-snug tracking-tight mb-3">
      <span data-i18n="introTitleA"></span> <br class="hidden sm:block">
      <span class="text-neutral-400" data-i18n="introTitleB"></span>
    </h2>
    <p class="text-sm text-neutral-500 leading-relaxed" data-i18n="introBody"></p>
  </div>

  <!-- ============ INDEX BOARD ============ -->
  <section class="mb-14 lg:mb-20 border-y border-neutral-100 py-8 lg:py-10">
    <div class="flex items-end justify-between mb-7 gap-3">
      <div>
        <h3 class="text-xs uppercase tracking-[0.2em] text-neutral-400 mb-2" data-i18n="indexHeader"></h3>
        <p class="text-sm text-neutral-600 max-w-xl" data-i18n="indexSub"></p>
      </div>
      <div class="text-right shrink-0">
        <p class="text-[10px] text-neutral-400 uppercase tracking-wider mb-0.5" data-i18n="indexDate"></p>
        <p class="text-[11px] text-neutral-700 num-feat font-medium">2026.05.09 (FRI)</p>
        <p class="text-[10px] text-neutral-400 num-feat mt-0.5" data-i18n="indexTime"></p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 lg:gap-10 mb-9 pb-9 border-b border-neutral-100">
      <div class="lg:col-span-2">
        <p class="text-[10px] uppercase tracking-wider text-neutral-400 mb-1" data-i18n="indexBCI"></p>
        <p class="text-5xl lg:text-6xl font-extralight tracking-tight num-feat" id="bciValue">—</p>
        <p class="text-sm mt-2 num-feat" id="bciChange">—</p>
      </div>
      <div class="lg:col-span-3">
        <svg id="bciChart" class="w-full h-20" viewBox="0 0 200 60" preserveAspectRatio="none"></svg>
        <div class="grid grid-cols-4 gap-3 mt-4 text-xs">
          <div><p class="text-[10px] text-neutral-400 uppercase tracking-wider" data-i18n="indexOpen"></p><p class="num-feat font-medium mt-0.5" id="bciOpen">—</p></div>
          <div><p class="text-[10px] text-neutral-400 uppercase tracking-wider" data-i18n="indexHigh"></p><p class="num-feat font-medium mt-0.5" id="bciHigh">—</p></div>
          <div><p class="text-[10px] text-neutral-400 uppercase tracking-wider" data-i18n="indexLow"></p><p class="num-feat font-medium mt-0.5" id="bciLow">—</p></div>
          <div><p class="text-[10px] text-neutral-400 uppercase tracking-wider" data-i18n="indexVolume"></p><p class="num-feat font-medium mt-0.5" id="bciVolume">—</p></div>
        </div>
      </div>
    </div>

    <div class="mb-9">
      <p class="text-[10px] uppercase tracking-wider text-neutral-400 mb-4" data-i18n="indexRegional"></p>
      <div id="regionalIndices" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"></div>
    </div>

    <div class="mb-9">
      <p class="text-[10px] uppercase tracking-wider text-neutral-400 mb-4">Sector Indices · 6 frames</p>
      <div id="sectorIndices" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"></div>
    </div>

    <div>
      <div class="flex items-end justify-between mb-4">
        <p class="text-[10px] uppercase tracking-wider text-neutral-400" data-i18n="indexMember"></p>
        <span class="text-[10px] text-neutral-400" data-i18n="indexMemberSub"></span>
      </div>
      <div id="memberStocks" class="border-y border-neutral-100"></div>
    </div>
  </section>

  <!-- ============ FRAME COMPASS ============ -->
  <section class="mb-14 lg:mb-20 border-b border-neutral-100 pb-8 lg:pb-10">
    <div class="flex items-end justify-between mb-2">
      <h3 class="text-xs uppercase tracking-[0.2em] text-neutral-400" data-i18n="frameHeader"></h3>
      <span class="text-[10px] text-neutral-400" data-i18n="frameMeta"></span>
    </div>
    <p class="text-sm text-neutral-600 mb-7 max-w-2xl" data-i18n="frameSub"></p>
    <div id="frameLegend" class="flex flex-wrap gap-x-4 gap-y-2 mb-6 text-[11px] text-neutral-600"></div>
    <div id="frameCompass" class="space-y-3 mb-7"></div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6 pt-6 border-t border-neutral-100">
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel1"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="frameNote1"></p></div>
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel2"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="frameNote2"></p></div>
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel3"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="frameNote3"></p></div>
    </div>
  </section>

  <!-- ============ MEMBER SPOTLIGHT ============ -->
  <section class="mb-14 lg:mb-20 border-b border-neutral-100 pb-8 lg:pb-10">
    <div class="flex items-end justify-between mb-2">
      <h3 class="text-xs uppercase tracking-[0.2em] text-neutral-400" data-i18n="memberHeader"></h3>
      <span class="text-[10px] text-neutral-400" data-i18n="memberMeta"></span>
    </div>
    <p class="text-sm text-neutral-600 mb-7 max-w-2xl" data-i18n="memberSub"></p>
    <div id="memberLegend" class="flex flex-wrap gap-x-4 gap-y-2 mb-6 text-[11px] text-neutral-600"></div>
    <div id="memberSpotlight" class="space-y-3 mb-7"></div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6 pt-6 border-t border-neutral-100">
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel1"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="memberNote1"></p></div>
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel2"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="memberNote2"></p></div>
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel3"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="memberNote3"></p></div>
    </div>
  </section>

  <!-- ============ TIME LAG ============ -->
  <section class="mb-14 lg:mb-20 border-b border-neutral-100 pb-8 lg:pb-10">
    <div class="flex items-end justify-between mb-2">
      <h3 class="text-xs uppercase tracking-[0.2em] text-neutral-400" data-i18n="timeLagHeader"></h3>
      <span class="text-[10px] text-neutral-400" data-i18n="timeLagMeta"></span>
    </div>
    <p class="text-sm text-neutral-600 mb-9 max-w-2xl" data-i18n="timeLagSub"></p>
    <div id="eventTimeline" class="space-y-7 mb-10"></div>
    <div class="border-t border-neutral-100 pt-7 mb-7">
      <div class="flex items-end justify-between mb-4">
        <p class="text-[10px] uppercase tracking-wider text-neutral-400" data-i18n="timeLagOriginFreq"></p>
        <span class="text-[10px] text-neutral-400" data-i18n="timeLagOriginCount"></span>
      </div>
      <div id="originFreq" class="space-y-2"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6 pt-6 border-t border-neutral-100">
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel1"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="timeLagNote1"></p></div>
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel2"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="timeLagNote2"></p></div>
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel3"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="timeLagNote3"></p></div>
    </div>
  </section>

  <!-- ============ TEXTURE ============ -->
  <section class="mb-14 lg:mb-20 border-b border-neutral-100 pb-8 lg:pb-10">
    <div class="flex items-end justify-between mb-2">
      <h3 class="text-xs uppercase tracking-[0.2em] text-neutral-400" data-i18n="textureHeader"></h3>
      <span class="text-[10px] text-neutral-400" data-i18n="textureMeta"></span>
    </div>
    <p class="text-sm text-neutral-600 mb-9 max-w-2xl" data-i18n="textureSub"></p>
    <div class="overflow-x-auto -mx-5 lg:-mx-8 px-5 lg:px-8 mb-9">
      <div class="min-w-[620px]">
        <div id="textureHeader" class="grid grid-cols-[150px_repeat(6,1fr)] gap-2 mb-2 text-[10px] uppercase tracking-wider text-neutral-400 border-b border-neutral-100 pb-2"></div>
        <div id="textureHeatmap" class="space-y-1"></div>
      </div>
    </div>
    <div class="border-t border-neutral-100 pt-7 mb-7">
      <p class="text-[10px] uppercase tracking-wider text-neutral-400 mb-4" data-i18n="textureSig"></p>
      <div id="signatureWords" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6 pt-6 border-t border-neutral-100">
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel1"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="textureNote1"></p></div>
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel2"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="textureNote2"></p></div>
      <div><p class="text-[10px] uppercase tracking-wider accent mb-2" data-i18n="noteLabel3"></p><p class="text-sm text-neutral-700 leading-relaxed" data-i18n="textureNote3"></p></div>
    </div>
  </section>

  <!-- ============ 2-COL ============ -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12">
    <section>
      <div class="flex items-end justify-between mb-5">
        <h2 class="text-xs uppercase tracking-[0.2em] text-neutral-400" data-i18n="newsHeader"></h2>
        <span class="text-[10px] text-neutral-400" data-i18n="newsSort"></span>
      </div>
      <div id="regionTabs" class="flex gap-1 mb-5 border-b border-neutral-100 overflow-x-auto tabs-scroll"></div>
      <div id="newsList" class="space-y-3 max-h-[760px] overflow-y-auto scrollbar-thin pr-2"></div>
    </section>
    <section>
      <div class="flex items-end justify-between mb-5">
        <h2 class="text-xs uppercase tracking-[0.2em] text-neutral-400" data-i18n="videoHeader"></h2>
        <span class="text-[10px] text-neutral-400" data-i18n="videoYT"></span>
      </div>
      <div id="hotVideos" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10"></div>
      <div class="flex items-end justify-between mb-4">
        <h2 class="text-xs uppercase tracking-[0.2em] text-neutral-400" data-i18n="shortsHeader"></h2>
        <span class="text-[10px] text-neutral-400" data-i18n="shortsVertical"></span>
      </div>
      <div id="shortsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    </section>
  </div>

  <!-- ============ ARCHIVE ============ -->
  <section class="mt-16 lg:mt-24 border-t border-neutral-100 pt-12">
    <div class="flex items-end justify-between mb-8">
      <div>
        <h2 class="text-xs uppercase tracking-[0.2em] text-neutral-400 mb-2" data-i18n="archiveLabel"></h2>
        <p class="text-2xl font-light tracking-tight"><span data-i18n="archiveTitle"></span> <span class="accent">2013 — 2026</span></p>
      </div>
    </div>
    <div id="archive" class="divide-y divide-neutral-100 border-y border-neutral-100"></div>
  </section>

  <footer class="mt-20 pt-8 border-t border-neutral-100 text-xs text-neutral-400 leading-relaxed">
    <p data-i18n="footer1"></p>
    <p class="mt-1" data-i18n="footer2"></p>
  </footer>
</main>

<!-- VIDEO MODAL -->
<div id="videoModal" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-4 fade-in">
  <div class="relative w-full max-w-4xl">
    <button id="closeModal" class="absolute -top-10 right-0 text-white text-2xl leading-none">&times;</button>
    <div class="aspect-video bg-black"><iframe id="videoFrame" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    <p id="videoCaption" class="text-white/80 text-sm mt-3 font-light"></p>
  </div>
</div>

// ========== UTILS ==========
const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : n;
const fmtKo = (n) => n >= 1e8 ? (n/1e8).toFixed(1)+(currentLang === 'ko' ? '억' : 'B') : n >= 1e4 ? (n/1e4).toFixed(1)+(currentLang === 'ko' ? '만' : 'K') : n.toLocaleString();
const ratio = (c, v) => ((c/v)*100).toFixed(2)+'%';
function buildSparkline(history, w, h) {
  if (!history.length) return '';
  const min = Math.min(...history), max = Math.max(...history);
  const range = max - min || 1;
  return history.map((v, i) => {
    const x = (i / (history.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 2) - 1;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}

  renderHotVideos();
  renderShorts();
  renderArchive();
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-tab').forEach(b => {
    if (b.dataset.lang === lang) {
      b.classList.add('accent', 'font-medium');
      b.classList.remove('text-neutral-400');
    } else {
      b.classList.remove('accent', 'font-medium');
      b.classList.add('text-neutral-400');
    }
  });
  renderAll();
}

// ========== EVENTS ==========
function bindLangTabs() {
  document.querySelectorAll('.lang-tab').forEach(b => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });
}
function bindVideoTriggers() {
  document.body.addEventListener('click', (e) => {
    const tr = e.target.closest('.video-trigger');
    if (!tr) return;
    document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${tr.dataset.vid}?autoplay=1&rel=0`;
    document.getElementById('videoCaption').textContent = tr.dataset.cap || '';
    const m = document.getElementById('videoModal');
    m.classList.remove('hidden'); m.classList.add('flex');
  });
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('videoModal').addEventListener('click', (e) => { if (e.target.id === 'videoModal') closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
}
function closeModal() {
  document.getElementById('videoFrame').src = '';
  const m = document.getElementById('videoModal');
  m.classList.add('hidden'); m.classList.remove('flex');
}

// ========== INIT ==========
async function loadData() {
  try {
    const res = await fetch('./data/today.json');
    if (!res.ok) throw new Error('not available');
    const data = await res.json();
    if (data.bci) Object.assign(indexData.BCI, data.bci);
    if (data.regional) for (const r in data.regional) {
      if (indexData[r]) Object.assign(indexData[r], data.regional[r]);
    }
    if (data.sectors) for (const s in data.sectors) {
      if (sectorData[s]) Object.assign(sectorData[s], data.sectors[s]);
    }
    if (data.members) for (const m in data.members) {
      if (memberStocks[m]) Object.assign(memberStocks[m], data.members[m]);
    }
    if (data.frameCompass) Object.assign(frameCompass, data.frameCompass);
    if (data.memberSpotlight) Object.assign(memberData, data.memberSpotlight);
    if (data.newsData) {
      for (const r in data.newsData) {
        if (Array.isArray(data.newsData[r]) && data.newsData[r].length) {
          newsData[r] = data.newsData[r];
        }
      }
    }
    if (data.bci && data.bci.volume) bciVolume = data.bci.volume;
    Object.values(indexData).forEach(idx => { idx.history = []; });
    Object.values(sectorData).forEach(idx => { idx.history = []; });
    initIndexHistory();
    if (data.date) {
      const dateEls = document.querySelectorAll('.num-feat');
      dateEls.forEach(el => {
        if (el.textContent.match(/^20\d\d\.\d\d\.\d\d/)) {
          el.textContent = data.date.replace(/-/g, '.') + ' (' + new Date(data.date).toLocaleDateString('en-US', {weekday: 'short'}).toUpperCase() + ')';
        }
      });
    }
    console.info('[BTS Wire] loaded', data.date, '·', data.totalItems, 'items');
  } catch (e) {
    console.info('[BTS Wire] using dummy data (today.json not found — see ops guide)');
  }
}

initIndexHistory();
bindLangTabs();
bindVideoTriggers();
setLang('ko');
loadData().then(() => setLang(currentLang)).catch(() => {});
</script>
